# Grafana loads any ConfigMap labelled grafana_dashboard through its sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: editalis-dashboard
  labels:
    grafana_dashboard: '1'
data:
  editalis.json: "{\n  \"title\": \"Editalis\",\n  \"uid\": \"editalis\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\"\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"Ready pods per deployment\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"kube_deployment_status_replicas_available{namespace=\\\"editalis\\\"}\",\n          \"legendFormat\"\
    : \"{{deployment}}{{container}}{{job_name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\",\n      \"title\": \"Container restarts (last hour)\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"increase(kube_pod_container_status_restarts_total{namespace=\\\"editalis\\\"}[1h])\",\n          \"legendFormat\": \"{{deployment}}{{container}}{{job_name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Hours since last successful backup\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\"\
    : 7,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"h\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(time() - max(kube_cronjob_status_last_successful_time{namespace=\\\"editalis\\\"})) / 3600\",\n          \"legendFormat\": \"{{deployment}}{{container}}{{job_name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Failed jobs\",\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 7,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"sum(kube_job_status_failed{namespace=\\\"editalis\\\"})\",\n          \"legendFormat\": \"{{deployment}}{{container}}{{job_name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Memory by container\",\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 7,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (container) (container_memory_working_set_bytes{namespace=\\\"editalis\\\", container!=\\\"\\\"})\",\n          \"legendFormat\": \"{{deployment}}{{container}}{{job_name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ]\n}"
