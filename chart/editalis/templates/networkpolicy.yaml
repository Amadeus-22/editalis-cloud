# Default deny for the release, then the two flows the application needs:
# ingress controller -> API, and pods -> DNS, PostgreSQL and HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "editalis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "editalis.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 443 }
